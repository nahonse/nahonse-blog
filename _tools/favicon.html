<!doctype html>
<html><head><meta charset="utf-8">
<!--
  파비콘(탭 아이콘) 512x512: 보라 원 + 금색 테 + 크림 바탕 + 고양이 얼굴(assets/toon/cat-hero.png, 2026-11-25 새 그림).
  만들기: chrome --headless=new --hide-scrollbars --allow-file-access-from-files --default-background-color=00000000 --window-size=512,512
          --screenshot="assets/brand/favicon-cat-512.png" "file:///.../_tools/favicon.html"
  그다음 ffmpeg로 favicon.ico(48), assets/images/favicon-192.png, apple-touch-icon.png(180, 흰 바탕)를 만든다. head.html의 ?v= 숫자를 올린다.
-->
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; overflow: hidden; }
  .o { position: absolute; inset: 4px; border-radius: 50%; background: #271350; }
  .g { position: absolute; inset: 26px; border-radius: 50%; background: #c7ad89; }
  .c { position: absolute; inset: 38px; border-radius: 50%; background: #fbf1df; overflow: hidden; }
  .c img { position: absolute; width: 470px; left: 50%; top: 6px; transform: translateX(-64%); }
</style></head>
<body><div class="o"></div><div class="g"></div><div class="c"><img src="../assets/toon/cat-hero.png"></div></body></html>
