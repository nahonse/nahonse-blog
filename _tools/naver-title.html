<!doctype html><html><head><meta charset="utf-8">
<!-- 네이버 블로그 타이틀 이미지(가로 966, 세로 240). 사이트 홈 머리(보라+금색, 고양이·강아지)와 같은 느낌. 만들기:
     chrome --headless=new --hide-scrollbars --window-size=966,240 --virtual-time-budget=8000

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

.c{position:absolute;bottom:-6px;height:215px}

  </div>
