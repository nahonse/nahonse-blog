<!doctype html>
<!--
  나혼세 인스타 카드뉴스(세로 1080x1350). 홈택스 화면을 따라 하는 "단계 카드"가 중심이다.
  1) 아래 decks에 글 슬러그를 키로 슬라이드를 넣는다. 숫자는 검토를 거친 블로그 글과 똑같이 쓴다.
  2) 장마다 캡처한다 (번호는 1부터):
     chrome --headless=new --hide-scrollbars --allow-file-access-from-files --window-size=1080,1350 --virtual-time-budget=8000
            --screenshot="assets/insta/슬러그/번호.png" "file:///.../_tools/insta.html#슬러그/1"
  슬라이드 종류
    cover : { type:"cover", label, title(줄바꿈 \n), badge, sub }
    facts : { type:"facts", title, rows:[[큰 글씨, 작은 글씨], ...], note }   note는 빨간 주의 문장
    calc  : { type:"calc", title, rows:[[항목, 금액], ...], total:[항목, 금액], note }
    step  : { type:"step", step, title, path, img, caption }   img는 저장소 기준 경로(assets/...)
    end   : { type:"end", title, text, source }
  문장 속 **굵게**는 금색 강조(어두운 바탕) 또는 보라 강조(밝은 바탕).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --brand:#271350; --gold:#c7ad89; --ink:#1e1433; --sub:#5e566e; --line:#e4dfec; --soft:#f4f0fa; --red:#c62828; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: "Pretendard","Malgun Gothic",sans-serif; color: var(--ink); word-break: keep-all; background: #fff; }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 0 80px; }
  .band { position: absolute; top: 0; left: 0; right: 0; height: 150px; background: var(--brand); border-bottom: 8px solid var(--gold);
          display: flex; align-items: center; padding: 0 80px; gap: 26px; }
  .band .num { width: 92px; height: 92px; border-radius: 50%; background: var(--gold); color: var(--brand);
               font-size: 52px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex: none; }
  .band .t { color: #fff; font-size: 50px; font-weight: 800; letter-spacing: -1px; line-height: 1.2; }
  .body { position: absolute; top: 200px; left: 80px; right: 80px; bottom: 130px; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 50px; display: flex; justify-content: space-between; align-items: center;
          font-size: 30px; font-weight: 700; color: var(--sub); }
  .foot b { color: var(--brand); font-weight: 900; }
  .red { color: var(--red); font-weight: 800; }
  b.em { color: var(--brand); }

  /* cover: 진한 보라 전면 */
  .cover { background: var(--brand); color: #fff; padding: 120px 90px; }
  .cover .ring { position: absolute; inset: 40px; border: 6px solid var(--gold); border-radius: 36px; pointer-events: none; }
  .cover .label { display: inline-block; font-size: 40px; font-weight: 800; color: var(--brand); background: var(--gold); padding: 12px 30px; border-radius: 14px; }
  .cover h1 { margin-top: 70px; font-size: 104px; line-height: 1.22; font-weight: 900; letter-spacing: -3px; white-space: pre-line; }
  .cover h1 b { color: var(--gold); }
  .cover .badge { margin-top: 70px; display: inline-block; font-size: 52px; font-weight: 900; color: var(--brand); background: #fff; padding: 20px 40px; border-radius: 18px; }
  .cover .sub { margin-top: 44px; font-size: 40px; font-weight: 600; color: #e6dcf5; line-height: 1.45; }
  .cover .foot { color: #d9cdea; } .cover .foot b { color: var(--gold); }

  /* facts */
  .row { display: flex; align-items: center; gap: 34px; padding: 40px 0; border-bottom: 3px solid var(--line); }
  .row .v { flex: none; width: 380px; font-size: 64px; font-weight: 900; color: var(--brand); letter-spacing: -2px; line-height: 1.15; }
  .row .k { font-size: 40px; font-weight: 600; color: var(--ink); line-height: 1.4; }
  .note { margin-top: 44px; font-size: 38px; line-height: 1.45; }
  .note.redbox { border: 4px solid var(--red); border-radius: 20px; padding: 28px 32px; background: #fdf1f1; color: var(--red); font-weight: 800; }

  /* calc */
  .calc .tag { display: inline-block; font-size: 32px; font-weight: 800; color: var(--sub); background: var(--soft); padding: 8px 20px; border-radius: 10px; margin-bottom: 26px; }
  .calc table { width: 100%; border-collapse: collapse; font-size: 40px; }
  .calc td { padding: 26px 8px; border-bottom: 3px solid var(--line); }
  .calc td:last-child { text-align: right; font-weight: 800; white-space: nowrap; }
  .calc .total td { border: 0; padding-top: 34px; font-size: 52px; font-weight: 900; color: var(--brand); }
  .calc .total td:last-child { color: var(--brand); }

  /* step */
  .path { font-size: 38px; font-weight: 800; color: var(--brand); background: var(--soft); border-left: 10px solid var(--gold);
          padding: 22px 28px; border-radius: 0 16px 16px 0; line-height: 1.4; }
  .shot { margin-top: 36px; border: 3px solid var(--line); border-radius: 22px; overflow: hidden; background: #fff;
          display: flex; align-items: center; justify-content: center; }
  .shot img { display: block; width: 100%; max-height: 760px; object-fit: contain; }
  .cap { margin-top: 30px; font-size: 38px; line-height: 1.45; font-weight: 600; }
  .when { position: absolute; right: 80px; bottom: 112px; font-size: 26px; color: var(--sub); }

  /* 강아지 안내(덱에 guide: true): 설명 문장을 강아지 말풍선으로 */
  .guide { margin-top: 26px; display: flex; align-items: flex-end; gap: 6px; }
  .guide .cap { margin: 0 0 40px; flex: 1; background: #fff; border: 4px solid var(--ink); border-radius: 28px; padding: 22px 28px; position: relative; }
  .guide .cap::after { content: ""; position: absolute; right: -22px; bottom: 30px; border: 14px solid transparent; border-left: 22px solid var(--ink); }
  .guide .guide-pic { flex: none; height: 220px; }
  .has-guide .shot img { max-height: 560px; }

  /* 캐릭터가 띠 오른쪽에서 고개를 내밂(덱에 guide: true) */
  .peek { position: absolute; top: 6px; right: 70px; height: 200px; z-index: 2; object-fit: cover; object-position: top; width: 150px; }
  .duo { position: absolute; right: 70px; bottom: 120px; display: flex; }
  .duo img { height: 300px; }

  /* end */
  .end .big { font-size: 64px; font-weight: 900; color: var(--brand); line-height: 1.3; letter-spacing: -1.5px; }
  .end .text { margin-top: 44px; font-size: 40px; line-height: 1.55; font-weight: 600; }
  .end .src { margin-top: 56px; font-size: 30px; color: var(--sub); line-height: 1.5; }
</style>
</head>

const md = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*(.+?)\*\*/g, "<b class=\"em\">$1</b>");
const [slug, n] = decodeURIComponent(location.hash.slice(1)).split("/");
const deck = decks[slug];
const i = (Number(n) || 1) - 1;
const s = deck.slides[i];
const total = deck.slides.length;
const foot = `<div class="foot"><b>@nahonse.kr</b><span>${deck.date} · ${i + 1}/${total}</span></div>`;
const band = (num, t) => `<div class="band">${num ? `<div class="num">${num}</div>` : ""}<div class="t">${md(t)}</div></div>`;
const root = document.getElementById("root");
if (s.type === "cover") {
  root.innerHTML = `<div class="slide cover"><div class="ring"></div><span class="label">${s.label}</span>
    <h1>${s.title.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</h1><div class="badge">${s.badge}</div><p class="sub">${s.sub}</p>${foot}</div>`;
} else if (s.type === "facts") {
  root.innerHTML = `<div class="slide">${band("", s.title)}<div class="body">
    ${s.rows.map(([v, k]) => `<div class="row"><div class="v">${v}</div><div class="k">${md(k)}</div></div>`).join("")}
    ${s.note ? `<p class="note redbox">${md(s.note)}</p>` : ""}</div>${foot}</div>`;
} else if (s.type === "calc") {
  root.innerHTML = `<div class="slide calc">${band("", s.title)}<div class="body"><span class="tag">${s.tag}</span><table>
    ${s.rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}
    <tr class="total"><td>${s.total[0]}</td><td>${s.total[1]}</td></tr></table>
    ${s.note ? `<p class="note redbox">${md(s.note)}</p>` : ""}</div>${foot}</div>`;
} else if (s.type === "step") {
  const img = p => `<div class="shot"><img src="../${p}"></div>`;
  root.innerHTML = `<div class="slide${deck.guide ? " has-guide" : ""}">${band(s.step, s.title)}<div class="body"><div class="path">${s.path}</div>
    ${img(s.img)}${s.img2 ? img(s.img2) : ""}${deck.guide
      ? `<div class="guide"><p class="cap">${md(s.caption)}</p><img class="guide-pic" src="${TOON}${s.guide_pic || "dog-point-left"}.png"></div>`
      : `<p class="cap">${md(s.caption)}</p>`}</div>
    <div class="when">2026년 11월 기준 화면</div>${foot}</div>`;
} else {
  root.innerHTML = `<div class="slide end">${band("", "더 자세한 내용은")}<div class="body"><p class="big">${s.title.replace(/\n/g, "<br>")}</p>
    <p class="text">${s.text.replace(/\n/g, "<br>")}</p><p class="src">${s.source.replace(/\n/g, "<br>")}</p></div>${foot}</div>`;
}
if (deck.guide && s.type !== "cover" && s.type !== "step") {
  const slide = root.firstElementChild;
  // 콩알눈(cat-neutral·cat-talk·dog-neutral) 그림은 쓰지 않음(2026-11-08 사용자). facts 기본은 cat-memo 좌우대칭
  const P = s.pic || { facts: "cat-memo", calc: "dog-talk" }[s.type];
  const flip = !s.pic && s.type === "facts" ? ' style="transform:scaleX(-1);top:34px"' : "";
  if (P) slide.insertAdjacentHTML("beforeend", `<img class="peek" src="${TOON}${P}.png"${flip}>`);
  if (s.type === "end") slide.insertAdjacentHTML("beforeend", `<div class="duo"><img src="${TOON}cat-cheer.png"><img src="${TOON}dog-cheer.png"></div>`);
}
