<!doctype html><html><body><pre id="out"></pre>
<script>
// 검사할 글 주소(/YYYY/MM/DD/ 다음 부분). 새 글을 쓰면 여기에 추가
const posts=[".","2026/11/03/tax-calendar-for-small-business","2026/11/04/hometax-interim-prepayment-check","2026/11/05/hometax-income-certificate","2026/11/05/hometax-tax-clearance-certificate","2026/11/06/hometax-business-registration","2026/11/07/hometax-e-tax-invoice","topics/invoice","topics/cert","topics/vat","topics/income","2026/11/07/hometax-business-card","2026/11/07/hometax-business-registration-certificate","2026/11/07/hometax-vat-data-calculator","calculators/vat","2026/11/07/vat-return-checklist-january","2026/11/07/hometax-incentive-late-application","2026/11/08/hometax-cash-receipt-issue","2026/11/08/hometax-tax-invoice-correction","2026/11/09/hometax-year-end-preview","2026/11/09/hometax-payment-certificate","2026/11/10/hometax-vat-base-certificate","start","2026/11/10/hometax-vat-amend-refund","2026/11/11/hometax-worker-refund-claim","2026/11/11/hometax-tax-invoice-list-check","2026/11/12/hometax-buyer-issued-tax-invoice","2026/11/13/hometax-tax-invoice-zero-rate-bulk","2026/11/13/hometax-card-receipt-statement","2026/11/14/hometax-vat-mock-compare"];
const out=document.getElementById('out');
window.addEventListener('message',e=>{out.textContent+=e.data+"\n";});
posts.forEach(p=>{
  const url="https://nahonse.kr/"+p+"/";
  fetch(url+"?c="+Date.now()).then(r=>r.text()).then(html=>{
    const probe=`<script>window.addEventListener('load',()=>setTimeout(()=>{
      const t=[...document.querySelectorAll('.post-content table')];
      const bad=t.map((x,i)=>[i+1,x.scrollWidth,x.clientWidth,(x.querySelector('th')||{}).textContent]).filter(a=>a[1]>a[2]+1);
      parent.postMessage('${p}: page='+document.documentElement.scrollWidth+'px tables='+t.length+' overflow='+JSON.stringify(bad),'*');
    },1500));<\/script>`;
    const f=document.createElement('iframe');
    f.style.width='390px';f.style.height='800px';
    f.srcdoc=html.replace('<head>','<head><base href="'+url+'">').replace('</body>',probe+'</body>');
    document.body.appendChild(f);
  }).catch(err=>out.textContent+=p+" ERROR "+err+"\n");
});
</script></body></html>
