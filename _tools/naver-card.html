  1) 아래 decks에 덱 이름(= _naver 폴더 이름)을 키로 theme와 cards를 넣는다. 숫자는 검토된 원고와 똑같이.
  2) 렌더: bash _tools/naver_cards.sh <덱 이름>  → assets/insta/<덱 이름>/1.png ~ n.png (push 해야 네이버가 불러감)
  카드 종류: cover(표지) / list(rows: [키, 설명] — 키가 ""이면 ✔ 점) / table(head, rows) / end(출처·기준일)
-->

<style>

  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #fff; }
  body { font-family: "Pretendard", "Malgun Gothic", sans-serif; color: var(--ink); word-break: keep-all; }
  .card { position: relative; width: 1080px; height: 1080px; padding: 84px 80px 0; }
  .top { position: absolute; inset: 0 0 auto 0; height: 22px; background: var(--c); }
  .chip { display: inline-block; font-size: 32px; font-weight: 700; color: var(--c); background: var(--soft); padding: 10px 24px; border-radius: 999px; }

  h2 { margin-top: 30px; font-size: 62px; line-height: 1.22; font-weight: 800; letter-spacing: -1.5px; color: var(--dk); }
  .rows { margin-top: 46px; display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; gap: 26px; align-items: center; background: var(--soft); border-radius: 22px; padding: 26px 32px; }
  .row .k { flex: 0 0 auto; min-width: 190px; font-size: 38px; font-weight: 800; color: var(--c); letter-spacing: -1px; white-space: nowrap; }
  .row .k.dot { min-width: 0; font-size: 36px; }
  .row .v { font-size: 34px; font-weight: 600; line-height: 1.4; }
  table { margin-top: 46px; width: 100%; border-collapse: separate; border-spacing: 0; font-size: 36px; border: 3px solid var(--line); border-radius: 22px; overflow: hidden; }
  th { background: var(--c); color: #fff; font-weight: 700; padding: 22px 18px; }
  td { padding: 24px 18px; text-align: center; font-weight: 600; border-top: 2px solid var(--line); }
  td:first-child { font-weight: 800; color: var(--dk); background: var(--soft); }
  td b { color: var(--c); }
  .note { margin-top: 30px; font-size: 30px; font-weight: 600; line-height: 1.45; color: var(--sub); border-left: 8px solid var(--c); padding: 6px 0 6px 24px; }
  .note.warn { color: #b42318; border-color: #d92d20; font-weight: 700; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 50px; display: flex; justify-content: space-between; font-size: 26px; font-weight: 600; color: var(--sub); }
  .foot b { color: var(--dk); }
  /* 표지 */
  .cover { background: var(--dk); color: #fff; padding-top: 150px; }
  .cover .top { background: var(--c); height: 30px; }
  .cover .chip { background: rgba(255,255,255,.14); color: #fff; font-size: 36px; }
  .cover h1 { margin-top: 44px; font-size: 92px; line-height: 1.16; font-weight: 900; letter-spacing: -3px; }
  .cover h1 em { font-style: normal; color: #ffd166; }
  .cover .sub { margin-top: 38px; font-size: 40px; font-weight: 600; line-height: 1.4; opacity: .88; }
  .cover .big { position: absolute; right: 80px; bottom: 130px; width: 330px; border-radius: 34px; background: #fff; color: var(--dk); text-align: center; padding: 26px 0 30px; box-shadow: 0 12px 0 var(--c); }
  .cover .big .t { font-size: 34px; font-weight: 800; color: #fff; background: var(--c); margin: -26px 0 14px; padding: 14px 0; border-radius: 34px 34px 0 0; }
  .cover .big .v { font-size: 96px; font-weight: 900; letter-spacing: -3px; line-height: 1; }
  .cover .big .s { margin-top: 12px; font-size: 32px; font-weight: 700; color: var(--sub); }
  .cover .foot { color: rgba(255,255,255,.75); }
  .cover .foot b { color: #fff; }
  /* 끝 장 */
  .end h2 { font-size: 54px; }
  .end ul { margin-top: 40px; list-style: none; display: flex; flex-direction: column; gap: 22px; font-size: 32px; font-weight: 600; line-height: 1.45; }
  .end li::before { content: "· "; color: var(--c); font-weight: 900; }
  .end .box { margin-top: 44px; background: var(--soft); border-radius: 22px; padding: 30px 34px; font-size: 32px; font-weight: 700; line-height: 1.5; color: var(--dk); }
</style>
</head>
