<!doctype html>
<!--
  잘린 캐릭터 그림 손보기(2026-11-11). toon-outline.html로 2배·굵기 맞춘 그림(?dir=폴더)에 손으로 정한 보정을 한다.
  좌표는 2배 그림 기준. 출력: <pre id="out">에 "이름 base64PNG" 줄 → assets/toon/이름.png 로 저장.
  - dog-think: 오른쪽 귀 위쪽·아래 끝에 빠진 테두리를 그림
  - cat-dizzy: 머리 왼쪽 일자로 잘린 곳을 둥글게 채우고 테두리, 왼쪽 24px 넓혀 꼬리 끝을 둥글게 막음
  - cat-contract: 왼쪽 40px 넓혀 서류 왼쪽 아래 모서리(기울기 따라)를 이어 그림
  크롬: chrome --headless=new --allow-file-access-from-files --virtual-time-budget=10000 --dump-dom "file:///.../_tools/toon-fix.html?dir=..."
-->
<meta charset="utf-8"><pre id="out"></pre>
<script>
const dir = new URLSearchParams(location.search).get("dir") || "../assets/toon";
const load = n => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = dir + "/" + n + ".png"; });
const INK = "rgb(53,38,29)", CAT_INK = "rgb(58,58,66)";
const lum = (p, k) => p[k] * .3 + p[k + 1] * .59 + p[k + 2] * .11;
function outlineEdges(g, w, h, boxes, col, rad) { // 불투명·밝은 픽셀이 투명과 rad 안에 붙어 있으면 테두리 색으로
  const d = g.getImageData(0, 0, w, h), p = d.data, src = new Uint8ClampedArray(p);
  for (const [x0, y0, x1, y1] of boxes) for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const k = (y * w + x) * 4; if (src[k + 3] < 128 || lum(src, k) < 90) continue;
    let near = false;
    for (let dy = -rad; dy <= rad && !near; dy++) for (let dx = -rad; dx <= rad; dx++) {
      if (dx * dx + dy * dy > rad * rad) continue;
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= w || yy >= h || src[(yy * w + xx) * 4 + 3] < 128) { near = true; break; }
    }
    if (near) { p[k] = col[0]; p[k + 1] = col[1]; p[k + 2] = col[2]; p[k + 3] = 255; }
  }
  g.putImageData(d, 0, 0);
}
async function fix(n) {
  const img = await load(n), pad = { "cat-dizzy": 24, "cat-contract": 40 }[n] || 0;
  const w = img.width + pad, h = img.height, c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.drawImage(img, pad, 0); g.lineCap = g.lineJoin = "round";
  // 곡선(2차 베지어) 왼쪽을 채운다: 줄마다 오른쪽 기준 칸(srcX)의 색을 복사해 털·서류 무늬가 이어지게
  const bez = (P0, C, P1) => { const pts = []; for (let t = 0; t <= 1.0001; t += 0.002) { const u = 1 - t; pts.push([u*u*P0[0] + 2*u*t*C[0] + t*t*P1[0], u*u*P0[1] + 2*u*t*C[1] + t*t*P1[1]]); } return pts; };
  const fillLeftOf = (pts, toX, srcX) => {
    const d = g.getImageData(0, 0, w, h), p = d.data, minX = {};
    for (const [x, y] of pts) { const yy = Math.round(y); minX[yy] = Math.min(minX[yy] ?? 1e9, x); }
    for (const yy in minX) { const y = +yy, s0 = (y * w + srcX) * 4;
      for (let x = Math.max(0, Math.floor(minX[yy])); x <= toX; x++) { const k = (y * w + x) * 4; p[k] = p[s0]; p[k+1] = p[s0+1]; p[k+2] = p[s0+2]; p[k+3] = 255; } }
    g.putImageData(d, 0, 0);
  };
  const stroke = (pts, col, lw) => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.strokeStyle = col; g.lineWidth = lw; g.stroke(); };
  if (n === "dog-think") {
    outlineEdges(g, w, h, [[300, 95, 427, 172], [360, 248, 427, 268]], [53, 38, 29], 8);
    // 11-11 사용자 지적: 귀 오른쪽 아래가 베어 먹은 듯 파임(170~252행) → 볼록한 곡선으로 채우고 바깥선
    const ear = bez([397, 152], [426, 206], [400, 255]), d = g.getImageData(0, 0, w, h), p = d.data, maxX = {};
    for (const [x, y] of ear) { const yy = Math.round(y); maxX[yy] = Math.max(maxX[yy] ?? -1, x); }
    for (const yy in maxX) { const y = +yy; if (y < 158 || y > 247) continue; const s0 = (y * w + 366) * 4;
      for (let x = Math.min(372, Math.floor(maxX[yy]) - 22); x <= Math.ceil(maxX[yy]); x++) { const k = (y * w + x) * 4; p[k] = p[s0]; p[k+1] = p[s0+1]; p[k+2] = p[s0+2]; p[k+3] = 255; } }
    g.putImageData(d, 0, 0); stroke(ear, INK, 8);
  }
  if (n === "cat-dizzy") {
    const head = bez([pad + 21, 262], [pad - 10, 315], [pad + 18, 368]);
    fillLeftOf(head, pad + 22, pad + 30); stroke(head, CAT_INK, 8);
    const tail = bez([pad + 4, 624], [pad - 34, 659], [pad + 4, 695]);
    fillLeftOf(tail, pad + 8, pad + 14); stroke(tail, CAT_INK, 8);
  }
  if (n === "cat-contract") {
    const P0 = [pad + 2, 304], P1 = [pad - 33, 390], P2 = [pad + 2, 403];
    const left = bez(P0, [(P0[0] + P1[0]) / 2, (P0[1] + P1[1]) / 2], P1), bot = bez(P1, [(P1[0] + P2[0]) / 2, (P1[1] + P2[1]) / 2], P2);
    fillLeftOf(left.concat(bot), pad + 6, pad + 10); stroke(left.concat(bot), "rgb(71,74,77)", 8);
  }
  return n + " " + c.toDataURL("image/png").split(",")[1];
}
(async () => { document.getElementById("out").textContent = [await fix("dog-think"), await fix("cat-dizzy"), await fix("cat-contract")].join("\n"); })();
</script>
