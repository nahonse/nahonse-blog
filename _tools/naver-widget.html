<!doctype html><html><head><meta charset="utf-8">
<!-- 네이버 블로그 사이드바 위젯 배너(170×230 표시, 2배 340×460으로 찍음). 누르면 nahonse.kr로 감. 만들기:
     chrome --headless=new --hide-scrollbars --window-size=340,460 --virtual-time-budget=8000
            --screenshot="assets/brand/naver-widget.png" "file:///.../_tools/naver-widget.html"
     위젯 직접등록 HTML(관리 > 꾸미기 설정 > 레이아웃·위젯 설정 > 위젯 직접등록):
     <a href="https://nahonse.kr/?utm_source=naver&utm_medium=widget" target="_blank"><img src="https://nahonse.kr/assets/brand/naver-widget.png" width="170" alt="나혼세 사이트 바로가기"></a> -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:340px;height:460px;overflow:hidden}
.w{position:relative;width:340px;height:460px;box-sizing:border-box;border-radius:24px;background:linear-gradient(170deg,#3a1f72,#1c0d3c);font-family:"Noto Sans KR";text-align:center;overflow:hidden}
.k{padding-top:34px;font-size:24px;font-weight:700;color:#c7ad89;letter-spacing:1px}
h2{margin:6px 0 0;font-size:44px;font-weight:900;color:#f1e7d6;line-height:1.2;letter-spacing:-1px}
p{margin:12px 0 0;font-size:22px;color:#e2d3bd;line-height:1.45}
.c{position:absolute;bottom:72px;height:130px}
.btn{position:absolute;left:28px;right:28px;bottom:22px;height:56px;line-height:56px;border-radius:28px;background:#c7ad89;color:#271350;font-size:24px;font-weight:900}
</style></head><body>
<div class="w">
  <div class="k">나 혼자 세무신고</div>
  <h2>홈택스 화면<br>전체 보기</h2>
  <p>캡처로 순서대로 정리했어요</p>
  <img class="c" src="../assets/toon/cat-happy.png" style="left:34px">
  <img class="c" src="../assets/toon/dog-yay.png" style="right:34px">  <!-- 홈 머리처럼 고양이 cat-happy·강아지 dog-yay 만세, 키 같게(11-09 사용자) -->
  <div class="btn">nahonse.kr 바로가기</div>
</div></body></html>
