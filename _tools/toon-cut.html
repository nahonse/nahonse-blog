<!doctype html>
<!--
  캐릭터 시트(이모션N.jpg, 커밋 안 함)에서 자세 하나씩 잘라 배경을 투명하게 만든다.
  CUTS에 [시트, 이름, x, y, w, h, 지울 사각형들(선택), 흰 틈 씨앗 점들(선택), 이 x보다 왼쪽 작은 조각 지우기(선택)] 을 적고 크롬 headless --dump-dom 으로 열면
  <pre id="out">에 "이름 base64PNG" 줄이 나온다 → 셸에서 assets/toon/이름.png 로 저장.
  배경: 가장자리와 이어진 밝은 색만 지움(눈 흰자는 남음). 자른 칸 테두리에 닿은 조각(옆 캐릭터)은 지운다.
-->
<meta charset="utf-8">
<pre id="out"></pre>
<script>
const CUTS = [
  ["이모션8", "dog-checklist", 60, 40, 350, 380], ["이모션8", "dog-reach", 425, 50, 285, 365], ["이모션8", "dog-cashier", 795, 40, 395, 370, [], [[1053, 283]]],
  ["이모션8", "cat-clipboard", 15, 500, 211, 390, [[[217, 652], [245, 652], [245, 780], [201, 780], [201, 753], [225.5, 680], [224, 678], [217, 678]]]], ["이모션8", "cat-guide", 222, 500, 233, 390], ["이모션8", "cat-papers", 450, 440, 345, 450],
  ["이모션8", "cat-cashier", 770, 500, 254, 390, [[1006, 500, 1024, 683], [1018, 740, 1024, 890], [965, 760, 1024, 830]]], ["이모션8", "cat-moneybags", 1003, 500, 197, 390, [[1003, 683, 1022, 750], [1003, 600, 1009, 683], [1003, 683, 1019, 790]], [], 1045],
  ["이모션9", "dog-stamp", 60, 40, 350, 380], ["이모션9", "dog-rich", 435, 15, 385, 400], ["이모션9", "dog-dizzy", 870, 0, 330, 420],
  ["이모션9", "cat-stamp", 15, 500, 192, 390], ["이모션9", "cat-contract", 207, 500, 248, 390], ["이모션9", "cat-rich", 450, 440, 350, 450],
  ["이모션9", "cat-dizzy", 1003, 420, 197, 470, [[1003, 683, 1022, 750], [1003, 600, 1009, 683]], [], 1045],
];
const out = document.getElementById("out"), sheets = {};
const load = n => sheets[n] || (sheets[n] = new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = "../" + n + ".jpg"; }));
(async () => {
  for (const [sheet, name, x, y, w, h, erase = [], holes = [], dropLeftOf = 0] of CUTS) {
    const img = await load(sheet), c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); g.drawImage(img, x, y, w, h, 0, 0, w, h);
    g.fillStyle = "#fff"; // 옆 캐릭터와 겹친 곳(시트 좌표): [x0,y0,x1,y1] 사각형 또는 [[x,y],...] 다각형
    for (const e of erase) {
      if (typeof e[0] === "number") { g.fillRect(e[0] - x, e[1] - y, e[2] - e[0], e[3] - e[1]); continue; }
      g.beginPath(); e.forEach(([px, py], i) => (i ? g.lineTo : g.moveTo).call(g, px - x, py - y)); g.closePath(); g.fill();
    }
    const d = g.getImageData(0, 0, w, h), p = d.data, N = w * h;
    const light = k => p[k * 4] > 228 && p[k * 4 + 1] > 228 && p[k * 4 + 2] > 228;
    const bg = new Uint8Array(N), st = [];
    for (const [hx, hy] of holes) st.push((hy - y) * w + (hx - x)); // 팔·소품 사이에 갇힌 흰 틈(시트 좌표 씨앗)도 배경으로
    for (let i = 0; i < w; i++) st.push(i, N - w + i);
    for (let j = 0; j < h; j++) st.push(j * w, j * w + w - 1);
    while (st.length) { const k = st.pop(); if (bg[k] || !light(k)) continue; bg[k] = 1; const i = k % w;
      if (i > 0) st.push(k - 1); if (i < w - 1) st.push(k + 1); if (k >= w) st.push(k - w); if (k < N - w) st.push(k + w); }
    // 전경 조각 나누기: 가장 큰 조각(캐릭터)은 남기고, 테두리에 닿은 다른 조각(옆 캐릭터)과 아주 작은 점은 지운다
    const lab = new Int32Array(N); let id = 0; const parts = [];
    for (let s = 0; s < N; s++) {
      if (bg[s] || lab[s]) continue; id++; const q = [s], mem = []; let edge = false; lab[s] = id;
      while (q.length) { const k = q.pop(); mem.push(k); const i = k % w, j = (k - i) / w;
        if (i === 0 || j === 0 || i === w - 1 || j === h - 1) edge = true;
        for (const n of [i > 0 ? k - 1 : -1, i < w - 1 ? k + 1 : -1, j > 0 ? k - w : -1, j < h - 1 ? k + w : -1])
          if (n >= 0 && !bg[n] && !lab[n]) { lab[n] = id; q.push(n); } }
      parts.push({ mem, edge });
    }
    const big = parts.reduce((a, b) => (b.mem.length > a.mem.length ? b : a));
    // dropLeftOf: 지운 자리에 남은 떨어진 조각(시트 x가 이 값보다 왼쪽에만 있는 작은 조각)도 지운다
    const leftOnly = t => dropLeftOf && t.mem.length < 600 && t.mem.every(k => x + (k % w) < dropLeftOf);
    for (const t of parts) if (t !== big && (t.edge || t.mem.length < 40 || leftOnly(t))) for (const k of t.mem) bg[k] = 1;
    // 새 시트(이모션8·9) 강아지는 주둥이가 회베이지라, 옛 강아지 주둥이 색(196,151,110)으로 맞춘다(사용자 요청 2026-11-07).
    // 위쪽 55% 안에서 회베이지(174,158,140) 근처 색이 이어진 가장 큰 덩어리만 바꾸고, 원래 명암 차이는 살린다.
    if (name.startsWith("dog-")) {
      const REF = [174, 158, 140], TO = [199, 152, 108], near = k => !bg[k] && Math.hypot(p[k*4]-REF[0], p[k*4+1]-REF[1], p[k*4+2]-REF[2]) < 34;
      const seen = new Uint8Array(N); let best = [];
      for (let s0 = 0; s0 < w * Math.floor(h * 0.55); s0++) {
        if (seen[s0] || !near(s0)) continue; const q = [s0], mem = []; seen[s0] = 1;
        while (q.length) { const k = q.pop(); mem.push(k); const i = k % w;
          for (const n of [i > 0 ? k - 1 : -1, i < w - 1 ? k + 1 : -1, k - w, k + w])
            if (n >= 0 && n < w * Math.floor(h * 0.55) && !seen[n] && near(n)) { seen[n] = 1; q.push(n); } }
        if (mem.length > best.length) best = mem;
      }
      // 옛 강아지는 주둥이가 얼굴과 같은 색이라, 회색 기운은 버리고 밝기 차이의 절반만 남긴다(명암만 살짝)
      const lum = k => 0.3 * p[k*4] + 0.59 * p[k*4+1] + 0.11 * p[k*4+2], L0 = 0.3 * REF[0] + 0.59 * REF[1] + 0.11 * REF[2];
      for (const k of best) { const dl = 0.5 * (lum(k) - L0); for (let c = 0; c < 3; c++) p[k*4+c] = Math.max(0, Math.min(255, Math.round(TO[c] + dl))); }
      // 주둥이 둘레의 채도 낮은 중간색(옅은 원으로 보임)만 3px까지 주둥이 색으로 채운다. 얼굴 갈색·검은 선은 건드리지 않는다.
      const ring = new Set(best); // 주둥이는 아래 몸 색 바꾸기에서 뺀다
      for (let it = 0; it < 3; it++) { const add = [];
        for (const k of ring) for (const n of [k - 1, k + 1, k - w, k + w]) {
          if (n < 0 || n >= N || ring.has(n) || bg[n]) continue; const mx = Math.max(p[n*4], p[n*4+1], p[n*4+2]), mn = Math.min(p[n*4], p[n*4+1], p[n*4+2]);
          if (mx > 70 && (mx - mn) / mx < 0.45 && p[n*4] >= p[n*4+2]) add.push(n); }
        for (const n of add) { if (ring.has(n)) continue; ring.add(n); const dl = 0.5 * (lum(n) - L0); for (let c = 0; c < 3; c++) p[n*4+c] = Math.max(0, Math.min(255, Math.round(TO[c] + dl))); } }
      // 몸·귀 갈색도 옛 강아지에 맞춤: 새 몸(157,110,58)→옛 몸(199,152,110), 새 귀(112,79,44)→옛 귀(150,112,82)라 둘 다 대략 +(42,42,50)만큼 밝다.
      // 곱하기로 바꾸면 주둥이 경계 중간색이 분홍으로 튀어서, 더하기로 바꾸고 채도 0.3~0.5 사이는 조금씩만 바꿔 경계를 부드럽게 잇는다.
      // 주황갈색(색상 20~45도)만 바꿔서 돈주머니(채도 낮음)·도장·계산기 같은 소품은 그대로 둔다.
      const OFF = [42, 42, 50];
      for (let k = 0; k < N; k++) {
        if (bg[k] || ring.has(k)) continue; const r = p[k*4], g2 = p[k*4+1], b = p[k*4+2], mx = Math.max(r, g2, b), mn = Math.min(r, g2, b);
        if (mx < 40 || mx !== r || mx === mn) continue;
        const hue = 60 * (g2 - b) / (mx - mn); if (hue < 20 || hue > 45) continue;
        const t = Math.max(0, Math.min(1, ((mx - mn) / mx - 0.3) / 0.2)); if (!t) continue;
        for (let c = 0; c < 3; c++) p[k*4+c] = Math.min(255, Math.round(p[k*4+c] + t * OFF[c]));
      }
    // 주둥이 둘레 옅은 선 지우기(2026-11-07 사용자 지적): 몸 색을 바꾼 뒤 주둥이와 그 둘레 6px 안에서 얼굴색에 가까운 픽셀(검은 선·코·입·혀 제외)을 얼굴색으로 칠한다
    if (ring.size) { const zone = new Set(ring); for (let it = 0; it < 6; it++) { const add = [];
      for (const k of zone) for (const n of [k - 1, k + 1, k - w, k + w]) if (n >= 0 && n < N && !zone.has(n) && !bg[n]) add.push(n);
      for (const n of add) zone.add(n); }
      // 칠할 색: 둘레 바로 바깥(4px 띠) 얼굴색의 평균 → 둘레와 똑같은 색이 되어 경계가 보이지 않는다
      const faceLike = n => { const r = p[n*4], g2 = p[n*4+1], b = p[n*4+2]; return Math.hypot(r - TO[0], g2 - TO[1], b - TO[2]) < 75 && g2 >= 0.62 * r; };
      const outer = new Set(zone); let fr = 0, fg = 0, fb = 0, fc = 0;
      for (let it = 0; it < 4; it++) { const add = []; for (const k of outer) for (const n of [k - 1, k + 1, k - w, k + w]) if (n >= 0 && n < N && !outer.has(n) && !bg[n]) add.push(n);
        for (const n of add) { if (outer.has(n)) continue; outer.add(n); if (faceLike(n)) { fr += p[n*4]; fg += p[n*4+1]; fb += p[n*4+2]; fc++; } } }
      const FILL = fc ? [fr / fc, fg / fc, fb / fc].map(Math.round) : TO;
      for (const n of zone) if (faceLike(n)) { p[n*4] = FILL[0]; p[n*4+1] = FILL[1]; p[n*4+2] = FILL[2]; } }
    }
    let x0 = w, y0 = h, x1 = 0, y1 = 0;
    for (let k = 0; k < N; k++) { if (bg[k]) { p[k * 4 + 3] = 0; continue; } const i = k % w, j = (k - i) / w;
      x0 = Math.min(x0, i); x1 = Math.max(x1, i); y0 = Math.min(y0, j); y1 = Math.max(y1, j); }
    g.putImageData(d, 0, 0);
    const t = document.createElement("canvas"); t.width = x1 - x0 + 1; t.height = y1 - y0 + 1;
    t.getContext("2d").drawImage(c, x0, y0, t.width, t.height, 0, 0, t.width, t.height);
    out.textContent += name + " " + t.toDataURL("image/png").split(",")[1] + "\n";
  }
  out.dataset.done = "1";
})();
</script>
