<!doctype html>
<!--
  나혼세 네컷만화 첫 장(세로 1080x1350) 초안. 고양이 사장님 + 강아지 이웃 사장님(임시 SVG 그림).
  캡처: chrome --headless=new --hide-scrollbars --window-size=1080,1350 --virtual-time-budget=8000
        --screenshot="assets/insta/슬러그/1.png" "file:///.../_tools/toon.html#슬러그"
  칸: { bg, scene(그림 SVG 문자열), talk:[[말한 사람, 대사], ...] }
  대사의 기한·금액은 검토를 거친 블로그 글과 같게 쓰고 tax-fact-checker 검토를 받는다. 겁주는 장면은 쓰지 않는다(당황 → 해결).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --brand:#271350; --gold:#c7ad89; --ink:#1e1e1e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: "Pretendard","Malgun Gothic",sans-serif; color: var(--ink); word-break: keep-all; background: var(--brand); padding: 44px 44px 0; }
  h1 { color: #fff; font-size: 56px; font-weight: 900; letter-spacing: -1.5px; text-align: center; margin-bottom: 30px; }
  h1 b { color: var(--gold); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 1110px; }
  .cell { position: relative; border: 6px solid var(--ink); border-radius: 14px; overflow: hidden; background: #fff; }
  .cell svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .talk { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .bubble { background: #fff; border: 4px solid var(--ink); border-radius: 22px; padding: 10px 18px; font-size: 29px; font-weight: 800; line-height: 1.3; }
  .bubble small { display: block; font-size: 19px; font-weight: 700; color: #8a6d45; }
  .bubble.r { align-self: flex-end; }
  .bubble em { font-style: normal; color: #c62828; }
  .foot { display: flex; justify-content: space-between; color: var(--gold); font-size: 26px; padding: 22px 4px 0; }
  .foot b { color: #fff; }
</style>
</head>
