<!doctype html>
<!--
  글 요약 카드 이미지(1200x630) 만들기
  1) 아래 cards에 글 슬러그를 키로 내용을 추가한다. 숫자는 글 본문(공식 출처로 확인한 값)과 똑같이 쓴다.
  2) 크롬 headless로 캡처한다.
     chrome --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000
            --screenshot="assets/images/cards/슬러그.png" "file:///.../_tools/card.html#슬러그"
  3) 글 머리말에 image: /assets/images/cards/슬러그.png 를 넣고(공유 미리보기),
     본문 도입부 아래에 ![설명](/assets/images/cards/슬러그.png) 를 넣는다.
  4) (세무 블로그에서는 거의 쓰지 않음) expired: "2026년" 을 적으면
     오른쪽 위에 빨간 "신고기간 종료" 도장이 찍힌다. 다음 신고 기간에 맞춰 글을 갱신하면 지운다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --brand: #271350; --gold: #c7ad89; --ink: #1e1433; --sub: #5e566e; --line: #e4dfec; --soft: #efeaf7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  body { font-family: "Pretendard", "Malgun Gothic", sans-serif; color: var(--ink); word-break: keep-all; }
  .card { position: relative; width: 1200px; height: 630px; padding: 60px 64px 0; border-top: 18px solid var(--brand); box-shadow: inset 0 6px 0 var(--gold); }
  .label { display: inline-block; font-size: 34px; font-weight: 700; color: var(--brand); background: var(--soft);
           padding: 8px 22px; border-radius: 10px; }
  h1 { margin-top: 26px; font-size: 56px; line-height: 1.25; font-weight: 800; letter-spacing: -1px; }
  .stats { display: flex; gap: 22px; margin-top: 52px; }
  .stat { flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 18px; padding: 34px 28px; background: #faf8fc; }
  .stat .v { font-size: 50px; font-weight: 800; color: var(--brand); letter-spacing: -1.5px; line-height: 1.15; white-space: nowrap; }
  .stat .k { margin-top: 14px; font-size: 28px; font-weight: 600; color: var(--sub); line-height: 1.3; }
  .foot { position: absolute; left: 64px; right: 64px; bottom: 34px; display: flex; justify-content: space-between;
          font-size: 26px; color: var(--sub); font-weight: 600; }
  .foot b { color: var(--ink); }
  .stamp { position: absolute; top: 30px; right: 44px; transform: rotate(-10deg); text-align: center;
           color: #d62828; border: 8px double #d62828; border-radius: 16px; padding: 8px 24px 10px;
           background: rgba(255,255,255,.9); }
  .stamp .s1 { font-size: 50px; font-weight: 900; letter-spacing: -1px; line-height: 1.15; }
  .stamp .s2 { font-size: 26px; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <span class="label" id="label"></span>
  <h1 id="title"></h1>
  <div class="stats" id="stats"></div>
  <div class="foot"><b>나혼세</b><span id="foot"></span></div>
  <div class="stamp" id="stamp" hidden><div class="s1">신고기간 종료</div><div class="s2" id="stamp-sub"></div></div>
</div>
<script>
const cards = {
  "tax-calendar-for-small-business": {
    label: "세무 일정 달력",
    title: "사장님 1년 세무 일정 한눈에",
    stats: [["매달 10일", "원천세 신고·납부"], ["매달 말일", "간이·일용 지급명세서"], ["1.25 · 5.31", "부가세 확정 · 종합소득세"]],
    foot: "2026.11.03 기준 · 출처: 국세청, 소득세법·부가가치세법"
  },
  "hometax-interim-prepayment-check": {
    label: "종합소득세 중간예납",
    title: "11월 중간예납, 홈택스로 조회하기",
    stats: [["11월 30일", "2026년 납부기한"], ["기준액의 ½", "2025년 귀속 세액 기준"], ["50만원 미만", "고지·징수 안 함"]],
    foot: "2026.11.04 기준 · 출처: 국세청, 소득세법"
  },
};
const c = cards[decodeURIComponent(location.hash.slice(1))];
document.getElementById("label").textContent = c.label;
document.getElementById("title").textContent = c.title;
document.getElementById("foot").textContent = c.foot;
document.getElementById("stats").innerHTML = c.stats
  .map(([v, k]) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");
if (c.expired) {
  document.getElementById("stamp").hidden = false;
  document.getElementById("stamp-sub").textContent = c.expired + " 마감";
}
// 칸보다 긴 글자는 한 줄에 들어갈 때까지 글씨를 줄인다 (글꼴을 다 불러온 뒤)
function fit(el, min) {
  let size = parseFloat(getComputedStyle(el).fontSize);
  el.style.whiteSpace = "nowrap";
  while (el.scrollWidth > el.clientWidth && size > min) { size -= 1; el.style.fontSize = size + "px"; }
}
document.fonts.ready.then(() => {
  fit(document.getElementById("title"), 40);
  document.querySelectorAll(".stat .v").forEach(el => fit(el, 30));
  document.querySelectorAll(".stat .k").forEach(el => fit(el, 22));
});
</script>
</body>
</html>
