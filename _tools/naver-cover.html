<!doctype html><html><head><meta charset="utf-8">
<!-- 네이버 블로그 모바일앱 커버(1080 정사각). 앱에서 아래쪽에 블로그명·프로필이 겹치므로 글자는 위쪽 가운데에 둔다. 만들기:
     chrome --headless=new --hide-scrollbars --window-size=1080,1080 --virtual-time-budget=8000
            --screenshot="assets/brand/naver-cover.png" "file:///.../_tools/naver-cover.html" -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#271350}</style></head><body>
<svg width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="g" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#3a1f72"/><stop offset="1" stop-color="#1c0d3c"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#g)"/>
  <!-- 배경 장식: 금색 가는 동심원 -->
  <g fill="none" stroke="#c7ad89" opacity=".18">
    <circle cx="540" cy="400" r="330" stroke-width="3"/>
    <circle cx="540" cy="400" r="420" stroke-width="2"/>
    <circle cx="540" cy="400" r="520" stroke-width="1.5"/>
  </g>
  <circle cx="540" cy="400" r="250" fill="none" stroke="#c7ad89" stroke-width="8"/>
  <text x="540" y="400" text-anchor="middle" font-family="Noto Sans KR" font-weight="900" font-size="150" fill="#c7ad89" letter-spacing="-4">나혼세</text>
  <rect x="400" y="440" width="280" height="4" rx="2" fill="#c7ad89" opacity=".6"/>
  <text x="540" y="510" text-anchor="middle" font-family="Noto Sans KR" font-weight="700" font-size="44" fill="#c7ad89" letter-spacing="2">나 혼자 세무신고</text>
  <text x="540" y="745" text-anchor="middle" font-family="Noto Sans KR" font-weight="500" font-size="40" fill="#e9dcc7">홈택스, 혼자서도 화면 순서대로</text>
  <text x="540" y="805" text-anchor="middle" font-family="Noto Sans KR" font-weight="500" font-size="30" fill="#c7ad89" opacity=".85" letter-spacing="1">세금계산서 · 증명 발급 · 부가세 · 종합소득세</text>
</svg></body></html>
